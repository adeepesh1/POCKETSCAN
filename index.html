<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>PocketScan</title>
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PocketScan">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#0f1115;--panel:#181b22;--panel2:#20242d;--line:#2b303b;
  --text:#eef0f4;--muted:#8b93a3;--accent:#3d8bff;--accent2:#2f6fd6;--danger:#ff5a5f;--ok:#2ecc71;
  --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.view{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg)}
.view.active{display:flex}
header{padding:calc(var(--st) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:var(--bg)}
header h1{font-size:20px;margin:0;flex:1;font-weight:700;letter-spacing:-.3px}
header .title{flex:1;font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{padding:6px 10px;border-radius:8px;color:var(--accent);font-weight:600;font-size:16px;min-width:60px}
.hbtn:active{background:var(--panel2)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
footer{padding:10px 16px calc(var(--sb) + 10px);border-top:1px solid var(--line);display:flex;gap:10px;background:var(--bg)}
.btn{flex:1;padding:13px 10px;border-radius:12px;background:var(--panel2);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent)}
.btn.primary:active{background:var(--accent2)}
.btn:active{opacity:.8}
.btn:disabled{opacity:.4}
.pro-badge{font-size:11px;background:#f5b400;color:#111;border-radius:6px;padding:2px 6px;font-weight:800}

/* Home */
.empty{text-align:center;color:var(--muted);padding:80px 30px}
.empty svg{opacity:.5;margin-bottom:14px}
.doclist{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.doc{background:var(--panel);border-radius:14px;overflow:hidden;border:1px solid var(--line);text-align:left}
.doc .thumb{aspect-ratio:3/4;background:#fff center/cover no-repeat}
.doc .meta{padding:8px 10px}
.doc .name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .sub{font-size:12px;color:var(--muted);margin-top:2px}
.fab-row{position:fixed;left:0;right:0;bottom:calc(var(--sb) + 18px);display:flex;justify-content:center;gap:12px;pointer-events:none}
.fab{pointer-events:auto;background:var(--accent);border-radius:30px;padding:15px 24px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(61,139,255,.35)}
.fab.alt{background:var(--panel2);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.install-tip{margin:12px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--muted);display:none}
.install-tip b{color:var(--text)}

/* Crop */
.stage{flex:1;position:relative;overflow:hidden;background:#000;touch-action:none}
.stage canvas{position:absolute;left:0;top:0}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:6px 12px;border-radius:20px;font-size:12px;color:#ddd;pointer-events:none;white-space:nowrap}
.tools{display:flex;justify-content:space-around;padding:8px 6px;background:var(--panel);border-top:1px solid var(--line)}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:6px 10px;border-radius:10px;min-width:64px}
.tool svg{width:24px;height:24px;stroke:var(--text)}
.tool:active{background:var(--panel2)}

/* Filters */
.preview{flex:1;display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden;background:#000}
.preview canvas{max-width:100%;max-height:100%;box-shadow:0 4px 30px rgba(0,0,0,.6)}
.filters{display:flex;gap:10px;padding:12px;overflow-x:auto;background:var(--panel);border-top:1px solid var(--line)}
.filter{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.filter canvas{width:64px;height:84px;border-radius:8px;border:2px solid transparent;background:#fff;object-fit:cover}
.filter.on{color:var(--text)}
.filter.on canvas{border-color:var(--accent)}

/* Doc view */
.pages{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.page{position:relative;background:#fff;border-radius:10px;overflow:hidden;aspect-ratio:3/4;border:1px solid var(--line)}
.page img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.page .num{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;border-radius:6px;padding:2px 7px}
.page .pact{position:absolute;right:4px;top:4px;display:flex;gap:4px}
.page .pact button{background:rgba(0,0,0,.6);color:#fff;border-radius:8px;width:30px;height:30px;font-size:15px;display:flex;align-items:center;justify-content:center}
.addpage{border:2px dashed var(--line);border-radius:10px;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:6px;font-size:13px}

/* OCR */
.ocrbox{padding:14px;display:flex;flex-direction:column;gap:10px;height:100%}
.ocrbox textarea{flex:1;width:100%;min-height:300px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;line-height:1.45;resize:none;font-family:inherit}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px}

/* Sheets & dialogs */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:50;align-items:flex-end;justify-content:center}
.backdrop.show{display:flex}
.sheet{background:var(--panel);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px calc(var(--sb) + 16px);display:flex;flex-direction:column;gap:10px;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:4px 0 2px;font-size:18px}
.sheet p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.sheet input{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;width:100%}
.sheet .row{display:flex;gap:10px}
.sheet ul{margin:0;padding-left:18px;color:var(--text);font-size:14px;line-height:1.7}
.busy{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:60;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#fff;font-size:14px}
.busy.show{display:flex}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 90px);transform:translateX(-50%);background:#333a47;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:70;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
input[type=file]{display:none}
</style>
</head>
<body>

<!-- HOME -->
<section class="view active" id="v-home">
  <header>
    <h1>PocketScan</h1>
    <button class="hbtn" id="btn-pro" style="min-width:auto"><span class="pro-badge" id="pro-label">GO PRO</span></button>
  </header>
  <main>
    <div class="install-tip" id="install-tip">Tip: tap <b>Share</b> → <b>Add to Home Screen</b> to install PocketScan like an app. It works offline too.</div>
    <div id="doclist" class="doclist"></div>
    <div id="empty" class="empty">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M8 9h8M8 12h8M8 15h5"/></svg>
      <div style="font-size:17px;color:var(--text);font-weight:600;margin-bottom:6px">No scans yet</div>
      <div>Tap <b>Scan</b> to photograph a document, or import from Photos.</div>
    </div>
    <div style="height:110px"></div>
  </main>
  <div class="fab-row">
    <button class="fab alt" id="btn-import">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>Import
    </button>
    <button class="fab" id="btn-scan">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Scan
    </button>
  </div>
</section>

<!-- CROP -->
<section class="view" id="v-crop">
  <header>
    <button class="hbtn" id="crop-cancel">Cancel</button>
    <div class="title">Adjust corners</div>
    <button class="hbtn" id="crop-next">Next</button>
  </header>
  <div class="stage" id="stage">
    <canvas id="crop-canvas"></canvas>
    <div class="hint" id="crop-hint">Drag the blue corners to the page edges</div>
  </div>
  <div class="tools" style="padding-bottom:calc(var(--sb) + 8px)">
    <button class="tool" id="t-auto"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>Auto detect</button>
    <button class="tool" id="t-full"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>Full image</button>
    <button class="tool" id="t-rot"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>Rotate</button>
  </div>
</section>

<!-- FILTER -->
<section class="view" id="v-filter">
  <header>
    <button class="hbtn" id="filter-back">Back</button>
    <div class="title">Choose a look</div>
    <button class="hbtn" id="filter-save">Save</button>
  </header>
  <div class="preview"><canvas id="filter-canvas"></canvas></div>
  <div class="filters" id="filters" style="padding-bottom:calc(var(--sb) + 12px)"></div>
</section>

<!-- DOC -->
<section class="view" id="v-doc">
  <header>
    <button class="hbtn" id="doc-back">‹ Scans</button>
    <div class="title" id="doc-title">Document</div>
    <button class="hbtn" id="doc-more">•••</button>
  </header>
  <main><div class="pages" id="pages"></div></main>
  <footer>
    <button class="btn" id="doc-ocr">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>Extract text</button>
    <button class="btn primary" id="doc-pdf">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4M12 2v13"/></svg>Share PDF</button>
  </footer>
</section>

<!-- OCR -->
<section class="view" id="v-ocr">
  <header>
    <button class="hbtn" id="ocr-back">‹ Back</button>
    <div class="title">Text</div>
    <button class="hbtn" id="ocr-copy">Copy</button>
  </header>
  <main>
    <div class="ocrbox">
      <div style="display:flex;gap:10px">
        <select id="ocr-lang" style="flex:1">
          <option value="eng">English</option>
          <option value="eng+hin">English + Hindi</option>
          <option value="eng+guj">English + Gujarati</option>
          <option value="eng+mar">English + Marathi</option>
          <option value="eng+tam">English + Tamil</option>
          <option value="eng+ben">English + Bengali</option>
        </select>
        <button class="btn primary" id="ocr-run" style="flex:0 0 auto;padding:10px 18px">Run</button>
      </div>
      <textarea id="ocr-text" placeholder="Recognised text will appear here. You can edit it before copying."></textarea>
      <button class="btn" id="ocr-share">Share as text</button>
    </div>
  </main>
</section>

<!-- Inputs -->
<input type="file" id="in-camera" accept="image/*" capture="environment">
<input type="file" id="in-photos" accept="image/*" multiple>

<!-- Sheet -->
<div class="backdrop" id="backdrop"><div class="sheet" id="sheet"></div></div>
<div class="busy" id="busy"><div class="spin"></div><div id="busy-text">Working…</div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONFIG — change these when you set up payments
   ========================================================= */
const CONFIG = {
  appName: 'PocketScan',
  freeOcrPerDay: 3,              // free users: OCR runs per day
  freeWatermark: true,           // free users: small footer on PDFs
  proPriceText: '₹99 / month',
  // Paste your Razorpay Payment Page / Stripe Payment Link here (see README):
  paymentLink: '',
};
const LIBS = {
  opencv: 'https://docs.opencv.org/4.10.0/opencv.js',
  jspdf: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  tesseract: 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js',
};

/* ---------------- tiny helpers ---------------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function show(id){ document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === id)); }
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }
function busy(on, text){ $('#busy').classList.toggle('show', !!on); if(text) $('#busy-text').textContent=text; }
const loaded = {};
function loadScript(src){
  if (loaded[src]) return loaded[src];
  loaded[src] = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.async = true;
    s.onload = res; s.onerror = () => { delete loaded[src]; rej(new Error('Could not load ' + src)); };
    document.head.appendChild(s);
  });
  return loaded[src];
}
function canvasToBlob(c, q=0.85){ return new Promise(r => c.toBlob(r, 'image/jpeg', q)); }
function blobToDataURL(b){ return new Promise(r => { const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); }); }
function loadImage(src){ return new Promise((res, rej) => { const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }

/* ---------------- sheet (dialogs) ---------------- */
function openSheet(html){ $('#sheet').innerHTML = html; $('#backdrop').classList.add('show'); }
function closeSheet(){ $('#backdrop').classList.remove('show'); }
$('#backdrop').addEventListener('click', e => { if (e.target.id === 'backdrop') closeSheet(); });
function confirmSheet(title, text, okText='OK', danger=false){
  return new Promise(res => {
    openSheet(`<h3>${title}</h3><p>${text}</p><div class="row"><button class="btn" id="s-no">Cancel</button><button class="btn ${danger?'':'primary'}" id="s-yes" style="${danger?'background:var(--danger)':''}">${okText}</button></div>`);
    $('#s-no').onclick = () => { closeSheet(); res(false); };
    $('#s-yes').onclick = () => { closeSheet(); res(true); };
  });
}
function promptSheet(title, value){
  return new Promise(res => {
    openSheet(`<h3>${title}</h3><input id="s-in" maxlength="80"><div class="row"><button class="btn" id="s-no">Cancel</button><button class="btn primary" id="s-yes">Save</button></div>`);
    const i = $('#s-in'); i.value = value || ''; setTimeout(() => i.focus(), 50);
    $('#s-no').onclick = () => { closeSheet(); res(null); };
    $('#s-yes').onclick = () => { closeSheet(); res(i.value.trim()); };
  });
}

/* =========================================================
   STORAGE — IndexedDB, on the user's phone
   ========================================================= */
const DB = {
  db: null,
  open(){
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('pocketscan', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('docs', { keyPath: 'id' });
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(mode, fn){
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('docs', mode); const st = t.objectStore('docs');
      const out = fn(st); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error);
    });
  },
  all(){ return this.tx('readonly', st => st.getAll()); },
  get(id){ return this.tx('readonly', st => st.get(id)); },
  put(doc){ return this.tx('readwrite', st => st.put(doc)); },
  del(id){ return this.tx('readwrite', st => st.delete(id)); },
};
// ask Safari not to evict our data
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

/* =========================================================
   PRO / LIMITS
   ========================================================= */
const Pro = {
  isPro(){ try { return localStorage.getItem('ps_pro') === '1'; } catch { return false; } },
  ocrUsedToday(){
    try { const o = JSON.parse(localStorage.getItem('ps_ocr') || '{}'); return o.d === new Date().toDateString() ? o.n : 0; } catch { return 0; }
  },
  countOcr(){
    try { localStorage.setItem('ps_ocr', JSON.stringify({ d: new Date().toDateString(), n: this.ocrUsedToday() + 1 })); } catch {}
  },
  canOcr(){ return this.isPro() || this.ocrUsedToday() < CONFIG.freeOcrPerDay; },
};
function refreshProLabel(){ $('#pro-label').textContent = Pro.isPro() ? 'PRO' : 'GO PRO'; }
function openPro(reason){
  if (Pro.isPro()) { openSheet(`<h3>You're on Pro ✨</h3><p>Thanks for supporting ${CONFIG.appName}.</p><button class="btn" onclick="closeSheet()">Close</button>`); return; }
  openSheet(`
    <h3>${CONFIG.appName} Pro <span class="pro-badge">${CONFIG.proPriceText}</span></h3>
    ${reason ? `<p style="color:#f5b400">${reason}</p>` : ''}
    <ul>
      <li>Unlimited text extraction (OCR)</li>
      <li>PDFs without the “${CONFIG.appName}” footer</li>
      <li>Cloud backup &amp; sync across devices (coming soon)</li>
    </ul>
    <button class="btn primary" id="s-buy">Upgrade</button>
    <button class="btn" onclick="closeSheet()">Not now</button>`);
  $('#s-buy').onclick = () => {
    if (CONFIG.paymentLink) { location.href = CONFIG.paymentLink; }
    else { toast('Payments not set up yet — see README'); }
  };
}
$('#btn-pro').onclick = () => openPro();

/* =========================================================
   HOME
   ========================================================= */
let thumbURLs = [];
async function renderHome(){
  thumbURLs.forEach(u => URL.revokeObjectURL(u)); thumbURLs = [];
  let docs = [];
  try { docs = await DB.all(); } catch(e) { toast('Storage unavailable'); }
  docs.sort((a, b) => b.updated - a.updated);
  const list = $('#doclist'); list.innerHTML = '';
  $('#empty').style.display = docs.length ? 'none' : 'block';
  for (const d of docs) {
    const el = document.createElement('button'); el.className = 'doc';
    let thumb = '';
    if (d.pages[0]) { thumb = URL.createObjectURL(d.pages[0].blob); thumbURLs.push(thumb); }
    el.innerHTML = `<div class="thumb" style="background-image:url('${thumb}')"></div>
      <div class="meta"><div class="name"></div><div class="sub">${d.pages.length} page${d.pages.length===1?'':'s'} · ${new Date(d.updated).toLocaleDateString()}</div></div>`;
    el.querySelector('.name').textContent = d.name;
    el.onclick = () => openDoc(d.id);
    list.appendChild(el);
  }
  refreshProLabel();
}
const isStandalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
if (!isStandalone && /iPhone|iPad|iPod/.test(navigator.userAgent)) $('#install-tip').style.display = 'block';

/* =========================================================
   CAPTURE FLOW
   ========================================================= */
let targetDocId = null;      // null = new document
let pendingFiles = [];       // queued imports
$('#btn-scan').onclick = () => { targetDocId = null; $('#in-camera').click(); };
$('#btn-import').onclick = () => { targetDocId = null; $('#in-photos').click(); };
$('#in-camera').onchange = e => startFiles(e.target.files, e.target);
$('#in-photos').onchange = e => startFiles(e.target.files, e.target);
function startFiles(files, input){
  pendingFiles = Array.from(files || []); input.value = '';
  nextPending();
}
async function nextPending(){
  const f = pendingFiles.shift();
  if (!f) return;
  busy(true, 'Loading photo…');
  try {
    const url = URL.createObjectURL(f);
    const img = await loadImage(url);   // Safari applies EXIF orientation
    URL.revokeObjectURL(url);
    // downscale to keep memory sane on phones
    const MAX = 2400; const s = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);

/* ---------- Edge detection (OpenCV.js, loaded on demand) ---------- */
let cvReady = null;
function getCV(){

    const done = () => { clearTimeout(t); res(window.cv); };
    if (window.cv && window.cv.Mat) return done();
    if (window.cv instanceof Promise) return window.cv.then(m => { window.cv = m; done(); });

}

}

/* ---------- Perspective warp (pure JS, no library needed) ---------- */
function solve(A, b){ // Gaussian elimination
  const n = b.length;

    let p = i; for (let r = i+1; r < n; r++) if (Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r;
    [A[i], A[p]] = [A[p], A[i]]; [b[i], b[p]] = [b[p], b[i]];
    for (let r = i+1; r < n; r++) { const f = A[r][i] / A[i][i]; for (let c = i; c < n; c++) A[r][c] -= f*A[i][c]; b[r] -= f*b[i]; }
  }

  for (let i = n-1; i >= 0; i--) { let s = b[i]; for (let c = i+1; c < n; c++) s -= A[i][c]*x[c]; x[i] = s / A[i][i]; }

}

  const sctx = src.getContext('2d'); const sd = sctx.getImageData(0, 0, src.width, src.height).data;

   FILTERS
   ========================================================= */
const FILTERS = [
  { id:'enhance', name:'Magic' },
  { id:'original', name:'Original' },
  { id:'gray', name:'Grayscale' },
  { id:'bw', name:'B & W' },

function percentiles(hist, total, lo, hi){

  for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc >= total*lo) { l = i; break; } }
  acc = 0; for (let i = 255; i >= 0; i--) { acc += hist[i]; if (acc >= total*(1-hi)) { h = i; break; } }
  return [l, Math.max(h, l+1)];
}

}

    await loadScript(LIBS.jspdf);
    const { jsPDF } = window.jspdf;
    const A4W = 210, A4H = 297, M = 0; let pdf;
    for (let i = 0; i < curDoc.pages.length; i++) {
      const pg = curDoc.pages[i], landscape = pg.w > pg.h;
      const pw = landscape ? A4H : A4W, ph = landscape ? A4W : A4H;
      if (!pdf) pdf = new jsPDF({ orientation: landscape ? 'l' : 'p', unit: 'mm', format: 'a4', compress: true });
      else pdf.addPage('a4', landscape ? 'l' : 'p');
      const k = Math.min((pw - M*2) / pg.w, (ph - M*2) / pg.h), w = pg.w*k, h = pg.h*k;
      pdf.addImage(await blobToDataURL(pg.blob), 'JPEG', (pw-w)/2, (ph-h)/2, w, h, undefined, 'FAST');
      if (!Pro.isPro() && CONFIG.freeWatermark) {
        pdf.setFontSize(8); pdf.setTextColor(150); pdf.text(`Scanned with ${CONFIG.appName}`, pw/2, ph - 4, { align: 'center' });
      }
    }
    const blob = pdf.output('blob'); busy(false);
    await shareFiles([new File([blob], safeName(curDoc.name) + '.pdf', { type: 'application/pdf' })], curDoc.name);
  } catch(e) { busy(false); toast(navigator.onLine ? 'PDF failed: ' + e.message : 'Connect to the internet once to enable PDF export'); }
};

/* =========================================================
   OCR (Tesseract.js, runs on the phone)
   ========================================================= */
$('#doc-ocr').onclick = () => {
  $('#ocr-text').value = curDoc.ocr || '';
  try { const l = localStorage.getItem('ps_lang'); if (l) $('#ocr-lang').value = l; } catch {}
  show('v-ocr'); if (!curDoc.ocr) runOCR();
};
$('#ocr-run').onclick = runOCR;
$('#ocr-back').onclick = () => openDoc(curDoc.id);
async function runOCR(){
  if (!Pro.canOcr()) return openPro(`You've used your ${CONFIG.freeOcrPerDay} free text extractions today.`);
  const lang = $('#ocr-lang').value; try { localStorage.setItem('ps_lang', lang); } catch {}
  busy(true, 'Loading text engine…');
  let worker;
  try {
    await loadScript(LIBS.tesseract);
    worker = await Tesseract.createWorker(lang.split('+'), 1, {
      logger: m => { if (m.status === 'recognizing text') $('#busy-text').textContent = `Reading page ${ocrPage}/${curDoc.pages.length}… ${Math.round(m.progress*100)}%`; }
    });
    let text = '';
    for (ocrPage = 1; ocrPage <= curDoc.pages.length; ocrPage++) {
      const { data } = await worker.recognize(curDoc.pages[ocrPage-1].blob);
      text += (curDoc.pages.length > 1 ? `--- Page ${ocrPage} ---\n` : '') + data.text.trim() + '\n\n';
    }
    curDoc.ocr = text.trim(); await DB.put(curDoc);
    $('#ocr-text').value = curDoc.ocr; Pro.countOcr();
    if (!Pro.isPro()) toast(`${Math.max(0, CONFIG.freeOcrPerDay - Pro.ocrUsedToday())} free extractions left today`);
  } catch(e) { toast(navigator.onLine ? 'Text extraction failed' : 'Text extraction needs internet the first time per language'); }
  finally { busy(false); if (worker) worker.terminate(); }
}
let ocrPage = 1;
$('#ocr-copy').onclick = async () => { try { await navigator.clipboard.writeText($('#ocr-text').value); toast('Copied'); } catch { $('#ocr-text').select(); toast('Select all and copy'); } };
$('#ocr-share').onclick = async () => {
  const text = $('#ocr-text').value; if (!text) return;
  try { await navigator.share({ title: curDoc.name, text }); } catch(e) { if (e.name !== 'AbortError') $('#ocr-copy').click(); }
};

   BOOT

// Payment return: your payment page redirects to  …/index.html?pro=<code>  (see README for the secure version)
(function(){
  const q = new URLSearchParams(location.search);
  if (q.get('pro')) { try { localStorage.setItem('ps_pro', '1'); } catch {} history.replaceState(null, '', location.pathname); setTimeout(() => toast('Pro unlocked — thank you!'), 400); }
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
renderHome();
</script>
